name: CI & Integrity Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Integrity & Mod Verification Tests
        run: |
          node tests/test_mod.js
          node tests/test_edge_cases.js
          node tests/test_shortcuts.js

      - name: Validate Shell Scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Validate Python Patcher Syntax
        run: |
          python3 -m py_compile src/patch-bundle.py
